apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f compose.yml -o petclinic_chart/templates/
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: mysql-server
  name: mysql-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mysql-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f compose.yml -o petclinic_chart/templates/
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: mysql-server
    spec:
      initContainers:
        - name: init-discovery-server
          image: busybox
          command: ['sh', '-c', 'until nc -z discovery-server:8761; do echo waiting for discovery-server; sleep 2; done;']
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: petclinicdb
            - name: MYSQL_ROOT_PASSWORD
              value: petclinicpass
          image: mysql:5.7
          name: mysql-server
          ports:
            - containerPort: 3306
              protocol: TCP
      restartPolicy: Always
